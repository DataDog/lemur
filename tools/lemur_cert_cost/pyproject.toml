[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lemur-cert-cost"
version = "0.1.0"
description = "CA-agnostic cost metric exporter + dashboard for certificates managed by Lemur"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["lemur_cost", "lemur_cost.clients"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
