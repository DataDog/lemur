AWSTemplateFormatVersion: "2010-09-09"
Description: Persistent AWS fixtures for Lemur sandbox task tests

Parameters:
  BaselineCertificateArn:
    Type: String
  CloudFrontCertificateId:
    Type: String
  CloudFrontAlias:
    Type: String

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.254.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: lemur-test
        - Key: lemur-test
          Value: persistent-fixture

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: lemur-test
          Value: persistent-fixture

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: lemur-test
          Value: persistent-fixture

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref RouteTable

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.254.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: lemur-test
          Value: persistent-fixture

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.254.2.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc
      Tags:
        - Key: lemur-test
          Value: persistent-fixture

  SubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref SubnetA

  SubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref SubnetB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public access to persistent Lemur test fixtures
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      VpcId: !Ref Vpc
      Tags:
        - Key: lemur-test
          Value: persistent-fixture

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: lemur-test-alb
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref SubnetA
        - !Ref SubnetB
      Tags:
        - Key: lemur-test
          Value: persistent-fixture
      Type: application

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: Lemur test fixture
            StatusCode: "200"
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP

  AlbHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !Ref BaselineCertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: Lemur test fixture
            StatusCode: "200"
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS

  NlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: lemur-test-nlb
      Port: 443
      Protocol: TCP
      TargetType: instance
      VpcId: !Ref Vpc
      Tags:
        - Key: lemur-test
          Value: persistent-fixture

  Nlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: lemur-test-nlb
      Scheme: internet-facing
      Subnets:
        - !Ref SubnetA
        - !Ref SubnetB
      Tags:
        - Key: lemur-test
          Value: persistent-fixture
      Type: network

  NlbTlsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !Ref BaselineCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbTargetGroup
      LoadBalancerArn: !Ref Nlb
      Port: 443
      Protocol: TLS

  ClassicElb:
    Type: AWS::ElasticLoadBalancing::LoadBalancer
    Properties:
      LoadBalancerName: lemur-test-elb
      Listeners:
        - InstancePort: "443"
          InstanceProtocol: TCP
          LoadBalancerPort: "443"
          Protocol: HTTPS
          SSLCertificateId: !Ref BaselineCertificateArn
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref SubnetA
        - !Ref SubnetB
      Tags:
        - Key: lemur-test
          Value: persistent-fixture

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: AlbHttpListener
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref CloudFrontAlias
        Comment: Persistent Lemur sandbox task test fixture
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
          TargetOriginId: lemur-test-alb
          ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2
        Origins:
          - CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
            DomainName: !GetAtt Alb.DNSName
            Id: lemur-test-alb
        PriceClass: PriceClass_100
        ViewerCertificate:
          IamCertificateId: !Ref CloudFrontCertificateId
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: lemur-test
          Value: persistent-fixture
        - Key: distribution/tls/lemur.managed
          Value: "true"

Outputs:
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
  ClassicElbDnsName:
    Value: !GetAtt ClassicElb.DNSName
  NlbDnsName:
    Value: !GetAtt Nlb.DNSName
